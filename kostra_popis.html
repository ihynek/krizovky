<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Popiš kostru</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦴</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#f3eee4; --card:#fffdf8; --ink:#2b2a33; --muted:#76705f; --line:#ddd2bd;
    --accent:#1f4e79; --accent-soft:#e1ecf6; --chip:#efe3c8; --chip-line:#c9b68f;
    --ok:#2f7d5b; --ok-soft:#dcefe4; --bad:#b3412e; --bad-soft:#f6ddd7;
    --display:"Literata",Georgia,serif; --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);line-height:1.5}
  main{max-width:1120px;margin:0 auto;padding-block:28px 48px;padding-inline:16px}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,44px);line-height:1.05;margin:0 0 6px;text-wrap:balance}
  .sub{margin:0 0 18px;color:var(--muted);max-width:68ch}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 24px -18px rgba(60,50,30,.45)}
  .chip{font:inherit;font-weight:700;font-size:15px;background:var(--chip);color:var(--ink);border:1.5px solid var(--chip-line);
    border-radius:999px;padding:7px 14px;cursor:pointer;touch-action:manipulation;user-select:none}
  .chip:hover{border-color:var(--accent)}
  .chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .chip.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
  .pool{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  button.btn{font:inherit;font-weight:700;border-radius:999px;padding:9px 18px;cursor:pointer;border:1.5px solid var(--ink);background:var(--ink);color:#fff}
  button.btn.ghost{background:transparent;color:var(--ink)}
  button.btn.acc{background:var(--accent);border-color:var(--accent)}
  button:focus-visible,.chip:focus-visible{outline:3px solid #f2c14e;outline-offset:2px}
  .status{min-height:1.5em;margin:12px 0 0;font-weight:700}
  .status.win{color:var(--ok)} .status.warn{color:var(--bad)}
  .label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 8px}
  footer{margin-top:28px;color:var(--muted);font-size:.85em;text-align:center}
  @media (prefers-reduced-motion:no-preference){.chip{transition:background .15s,border-color .15s}}

  /* rozvržení: obrázek vlevo, popisky vpravo; na mobilu pod sebou */
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .tab{font:inherit;font-weight:700;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .tab .done{color:var(--ok);margin-left:6px}
  .tab[aria-selected="true"] .done{color:#fff}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
  @media (max-width:820px){.layout{grid-template-columns:1fr}}
  .fig svg{width:100%;max-height:68vh;display:block;margin:0 auto}
  .fig .mk{cursor:pointer}
  .fig .mk.on circle{fill:#f2c14e} .fig .mk.on text{fill:#2b2a33}
  .note{color:var(--muted);font-size:.92em;margin:8px 0 0;text-align:center}
  .slots{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:6px}
  .slot{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center}
  .slot .n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
  .drop{min-height:40px;border:1.5px dashed var(--chip-line);border-radius:12px;padding:4px 6px;display:flex;align-items:center;cursor:pointer;background:#fff}
  .drop.hot{border-color:var(--accent);background:var(--accent-soft)}
  .drop.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
  .drop.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
  .drop:empty::before{content:"klepni sem";color:var(--muted);font-size:.85em;padding-left:6px}
</style>
</head>
<body>
<main>
  <h1>Popiš kostru</h1>
  <p class="sub">Vyber popisek v zásobníku a klepni na řádek se správným číslem (na počítači můžeš popisek i přetáhnout). Klepnutím na vložený popisek ho vrátíš zpět. Jeden popisek v zásobníku navíc nikam nepatří.</p>
  <div class="tabs" role="tablist"><button class="tab" role="tab" id="t-kost" data-i="0">Dlouhá kost</button><button class="tab" role="tab" id="t-obratel" data-i="1">Obratel</button><button class="tab" role="tab" id="t-kloub" data-i="2">Kloub</button></div>
  <div class="layout">
    <section class="card"><div class="fig" id="f0" hidden><svg viewBox="0 0 270 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Podélný řez dlouhou kostí"><defs><pattern id="spg" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#efe3c8"/><circle cx="3" cy="3" r="2.2" fill="#d9c49a"/><circle cx="9" cy="9" r="2.6" fill="#d9c49a"/></pattern></defs><path d="M95,150 C60,140 50,100 60,70 C70,35 100,22 130,22 C160,22 190,35 200,70 C210,100 200,140 165,150 L165,410 C200,420 210,460 200,490 C190,525 160,538 130,538 C100,538 70,525 60,490 C50,460 60,420 95,410 Z" fill="#d9c49a" stroke="#6f5f45" stroke-width="2"/><path d="M105,150 C78,140 70,105 78,78 C86,50 108,38 130,38 C152,38 174,50 182,78 C190,105 182,140 155,150 Z" fill="url(#spg)"/><path d="M105,410 C78,420 70,455 78,482 C86,510 108,522 130,522 C152,522 174,510 182,482 C190,455 182,420 155,410 Z" fill="url(#spg)"/><rect x="95" y="146" width="70" height="9" fill="#bcd8ee"/><rect x="95" y="405" width="70" height="9" fill="#bcd8ee"/><rect x="112" y="168" width="36" height="224" rx="15" fill="#f2cf6b" stroke="#6f5f45" stroke-width="1"/><path d="M62,72 C70,38 100,23 130,23 C160,23 190,38 198,72 C188,50 160,35 130,35 C100,35 72,50 62,72 Z" fill="#bcd8ee"/><path d="M62,488 C70,522 100,537 130,537 C160,537 190,522 198,488 C188,510 160,525 130,525 C100,525 72,510 62,488 Z" fill="#bcd8ee"/><line x1="91" y1="162" x2="91" y2="400" stroke="#b3412e" stroke-width="3"/><line x1="169" y1="162" x2="169" y2="400" stroke="#b3412e" stroke-width="3"/><path d="M52,30 L44,30 L44,145 L52,145" fill="none" stroke="#2b2a33" stroke-width="1.5"/><line x1="35" y1="88" x2="44" y2="88" stroke="#2b2a33" stroke-width="1.3"/><g class="mk" data-n="2"><circle cx="22" cy="88" r="13" fill="#1f4e79"/><text x="22" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="sans-serif">2</text></g><path d="M52,168 L44,168 L44,392 L52,392" fill="none" stroke="#2b2a33" stroke-width="1. y="380" r="3" fill="#2b2a33"/><g class="mk" data-n="5"><circle cx="248" cy="395" r="13" fill="#1f4e79"/><text x="248" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="sans-serif">5</text></g></svg></div><div class="fig" id="f1" hidden><svg viewBox="0 0 320 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Obratel při pohledu shora"><path d="M120,150 L45,118 C37,115 33,129 42,133 L118,172 Z" fill="#efe3c8" stroke="#6f5f45" stroke-width="2"/><path d="M200,150 L275,118 C283,115 287,129 278,133 L202,172 Z" fill="#efe3c8" stroke="#6f5f45" stroke-width="2"/><path d="M146,108 L152,30 C154,21 166,21 168,30 L174,108 Z" fill="#efe3c8" stroke="#6f5f45" stroke-width="2"/><path d="M100,195 C88,150 105,100 160,95 C215,100 232,150 220,195 Z" fill="#efe3c8" stroke="#6f5f45" stroke-width="2"/><ellipse cx="160" cy="222" rx="72" ry="52" fill="#d9c49a" stroke="#6f5f45" stroke-width="2"/><ellipse cx="160" cy="140" rx="38" ry="30" fill="#fffdf8" stroke="#6f5f45" stroke-width="2"/><text x="160" y="292" text-anchor="middle" font-size="11" fill="#76705f" font-family="sans-serif">břišní strana ↓ · pohled shora</text><line x1="298" y1="245" x2="175" y2="232" stroke="#2b2a33" stroke-width="1.3"/><circle cx="175" cy="232" r="3" fill="#2b2a33"/><g class="mk" data-n="1"><circle cx="298" cy="245" r="13" fill="#1f4e79"/><text x="298" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="sans-serif">1</text></g><line x1="28" y1="62" x2="128" y2="108" stroke="#2b2a33" stroke-width="1.3"/><circle cx="128" cy="108" r="3" fill="#2b2a33"/><g class="mk" data-n="2"><circle cx="28" cy="62" r="13" fill="#1f4e79"/><text x="28" y="67" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="sans-serif">2</text></g><line x1="298" y1="150" x2="168" y2="145" stroke="#2b2a33" stroke-width="1.3"/><circle cx="168" cy="145" r="3" fill="#2b2a33"/><g class="mk" data-n="3"><circle cx="298" cy="150" r="13" fill="#1f4e79"/><text x="298" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="sans-serif">3</text></g><line x1="28" y1="178" x2="62" y2="127" stroke="#2b2a33" stroke-width="1.3"/><circle cx="62" cy="127" r="3" fill="#2b2a33"/><g class="mk" data-n="4"><circle cx="28" cy="178" r="13" fill="#1f4e79"/><text x="28" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="sans-serif">4</text></g><line x1="252" y1="38" x2="164" y2="52" stroke="#2b2a33" stroke-width="1.3"/><circle cx="164" cy="52" r="3" fill="#2b2a33"/><g class="mk" data-n="5"><circle cx="252" cy="38" r="13" fill="#1f4e79"/><text x="252" y="43" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="sans-serif">5</text></g></svg></div><div class="fig" id="f2" hidden><svg viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stavba kloubu"><path d="M122,95 C80,110 60,170 72,222 L228,222 C240,170 220,110 178,95 Z" fill="#fff4c2"/><circle cx="150" cy="186" r="64" fill="#fff4c2"/><path d="M70,352 L70,215 L95,215 A62,62 0 0 0 205,215 L230,215 L230,352" fill="#efe3c8" stroke="#6f5f45" stroke-width="2"/><path d="M95,215 A62,62 0 0 0 205,215" fill="none" stroke="#bcd8ee" stroke-width="9"/><rect x="122" y="0" width="56" height="150" fill="#efe3c8"/><line x1="122" y1="0" x2="122" y2="140" stroke="#6f5f45" stroke-width="2"/><line x1="178" y1="0" x2="178" y2="140" stroke="#6f5f45" stroke-width="2"/><circle cx="150" cy="186" r="54" fill="#efe3c8"/><path d="M122,140 A54,54 0 1 0 178,140" fill="none" stroke="#6f5f45" stroke-width="2"/><path d="M103.4,204 A50,50 0 0 0 196.6,204" fill="none" stroke="#bcd8ee" stroke-width="8"/><path d="M122,95 C80,110 60,170 72,222" fill="none" stroke="#b3412e" stroke-width="5" stroke-linecap="round"/><path d="M178,95 C220,110 240,170 228,222" fill="none" stroke="#b3412e" stroke-width="5" stroke-linecap="round"/><line x1="275" y1="160" x2="165" y2="170" stroke="#2b2a33" stroke-width="1.3"/><circle cx="165" cy="170" r="3" fill="#2b2a33"/><g class="mk" data-n="1"><circle cx="275" cy="160" r="13" fill="#1f4e79"/><text x="275" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="sans-serif">1</text></g><line x1="275" y1="290" x2="190" y2="262" stroke="#2b2a33" stroke-width="1.3"/><circle cx="190" cy="262" r="3" fill="#2b2a33"/><g class="mk" data-n="2"><circle cx="275" cy="290" r="13" fill="#1f4e79"/><text x="275" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="sans-serif">2</text></g><line x1="25" y1="295" x2="128" y2="236" stroke="#2b2a33" stroke-width="1.3"/><circle cx="128" cy="236" r="3" fill="#2b2a33"/><g class="mk" data-n="3"><circle cx="25" cy="295" r="13" fill="#1f4e79"/><text x="25" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="sans-serif">3</text></g><line x1="25" y1="135" x2="71" y2="165" stroke="#2b2a33" stroke-width="1.3"/><circle cx="71" cy="165" r="3" fill="#2b2a33"/><g class="mk" data-n="4"><circle cx="25" cy="135" r="13" fill="#1f4e79"/><text x="25" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="sans-serif">4</text></g><line x1="275" y1="80" x2="216" y2="165" stroke="#2b2a33" stroke-width="1.3"/><circle cx="216" cy="165" r="3" fill="#2b2a33"/><g class="mk" data-n="5"><circle cx="275" cy="80" r="13" fill="#1f4e79"/><text x="275" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="sans-serif">5</text></g></svg></div><p class="note" id="note"></p></section>
    <section class="card">
      <p class="label">Popisky</p>
      <ol class="slots" id="slots"></ol>
      <p class="label">Zásobník</p>
      <div class="pool" id="pool"></div>
      <div class="controls">
        <button class="btn" id="check">Zkontrolovat</button>
        <button class="btn ghost" id="clear">Vymazat</button>
        <button class="btn acc" id="next" hidden>Další obrázek</button>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </section>
  </div>
  <footer>Biologie · kap. 136–140 · Gymnázium Joachima Barranda Beroun</footer>
</main>
<script>
const D = [{"name": "Dlouhá kost", "note": "Podélný řez dlouhou kostí (kap. 136).", "labels": ["kloubní chrupavka", "epifýza (hlavice)", "houbovitá kostní tkáň", "růstová chrupavka", "hutná kostní tkáň", "dřeňová dutina", "okostice", "diafýza (tělo)"], "extra": ["Haversův kanálek"]}, {"name": "Obratel", "note": "Hrudní nebo bederní obratel shora (kap. 138).", "labels": ["tělo obratle", "obratlový oblouk", "obratlový otvor", "příčný výběžek", "trnový výběžek"], "extra": ["zub čepovce"]}, {"name": "Kloub", "note": "Stavba kloubu (kap. 136).", "labels": ["kloubní hlavice", "kloubní jamka", "kloubní chrupavka", "kloubní pouzdro", "kloubní dutina s mazem"], "extra": ["meniskus"]}];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// stav každého obrázku: placed[i] = index popisku v D.labels (nebo null); pool = pořadí v zásobníku
const S = D.map(d => ({ placed: d.labels.map(() => null), pool: shuffle([...d.labels.map((_, i) => i), ...d.extra.map((_, i) => 100 + i)]), done: false }));
let cur = 0, sel = null;
const txt = (d, k) => k >= 100 ? d.extra[k - 100] : d.labels[k];
const $ = id => document.getElementById(id);
const status = (t, c = "") => { $("status").className = "status " + c; $("status").textContent = t; };

function chip(k, where) {
  const d = D[cur], b = document.createElement("button");
  b.className = "chip" + (sel && sel.k === k ? " sel" : ""); b.textContent = txt(d, k); b.type = "button";
  b.draggable = true;
  b.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", String(k)); sel = { k }; });
  b.addEventListener("click", e => {
    e.stopPropagation();
    if (where === "pool") { sel = sel && sel.k === k ? null : { k }; render(); }
    else { S[cur].placed[where] = null; S[cur].pool.push(k); sel = null; clearMarks(); render(); }
  });
  return b;
}
function place(slot, k) {
  const st = S[cur];
  st.pool = st.pool.filter(x => x !== k);
  if (st.placed[slot] !== null) st.pool.push(st.placed[slot]);
  st.placed[slot] = k; sel = null; clearMarks(); render();
}
function clearMarks() { document.querySelectorAll(".drop").forEach(x => x.classList.remove("ok", "bad")); status(""); }
function render() {
  const d = D[cur], st = S[cur];
  D.forEach((x, i) => {
    const t = $("t-" + ["kost","obratel","kloub"][i]);
    t.setAttribute("aria-selected", i === cur); t.innerHTML = x.name + (S[i].done ? '<span class="done">✓</span>' : "");
    $("f" + i).hidden = i !== cur;
  });
  $("note").textContent = d.note;
  const ol = $("slots"); ol.innerHTML = "";
  d.labels.forEach((_, i) => {
    const li = document.createElement("li"); li.className = "slot";
    li.innerHTML = `<span class="n">${i + 1}</span>`;
    const dr = document.createElement("div"); dr.className = "drop"; dr.id = "d" + i; dr.tabIndex = 0;
    dr.setAttribute("aria-label", "Popisek číslo " + (i + 1));
    if (st.placed[i] !== null) dr.appendChild(chip(st.placed[i], i));
    dr.addEventListener("click", () => { if (sel) place(i, sel.k); else status("Nejdřív vyber popisek v zásobníku."); });
    dr.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && sel) { e.preventDefault(); place(i, sel.k); } });
    dr.addEventListener("dragover", e => { e.preventDefault(); dr.classList.add("hot"); });
    dr.addEventListener("dragleave", () => dr.classList.remove("hot"));
    dr.addEventListener("drop", e => { e.preventDefault(); dr.classList.remove("hot"); place(i, +e.dataTransfer.getData("text/plain")); });
    dr.addEventListener("mouseenter", () => mark(i, true)); dr.addEventListener("mouseleave", () => mark(i, false));
    li.appendChild(dr); ol.appendChild(li);
  });
  const pool = $("pool"); pool.innerHTML = "";
  st.pool.forEach(k => pool.appendChild(chip(k, "pool")));
  if (!st.pool.length) pool.innerHTML = '<span style="color:var(--muted)">Zásobník je prázdný.</span>';
  $("next").hidden = !st.done;
}
function mark(i, on) { document.querySelectorAll("#f" + cur + " .mk").forEach(m => m.classList.toggle("on", on && +m.dataset.n === i + 1)); }

// klepnutí na číslo v obrázku = výběr řádku
document.querySelectorAll(".fig .mk").forEach(m => m.addEventListener("click", () => {
  const i = +m.dataset.n - 1; if (sel) place(i, sel.k); else { $("d" + i).focus(); mark(i, true); }
}));
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { cur = +t.dataset.i; sel = null; status(""); render(); }));

$("check").addEventListener("click", () => {
  const st = S[cur]; let ok = 0, empty = 0;
  st.placed.forEach((k, i) => {
    const dr = $("d" + i); dr.classList.remove("ok", "bad");
    if (k === null) { empty++; return; }
    if (k === i) { ok++; dr.classList.add("ok"); } else dr.classList.add("bad");
  });
  const n = st.placed.length;
  if (ok === n) {
    st.done = true; render();
    st.placed.forEach((_, i) => $("d" + i).classList.add("ok"));
    const all = S.every(x => x.done);
    status(all ? "Výborně! Všechny tři obrázky jsou popsané správně." : "Správně! Pokračuj dalším obrázkem.", "win");
  } else status(`Správně: ${ok} z ${n}.` + (empty ? ` Nevyplněno: ${empty}.` : "") + (n - ok - empty ? " Červené popisky vyměň." : ""), n - ok - empty ? "warn" : "");
});
$("clear").addEventListener("click", () => {
  const st = S[cur]; st.placed.forEach((k, i) => { if (k !== null) st.pool.push(k); st.placed[i] = null; });
  st.done = false; sel = null; clearMarks(); render();
});
$("next").addEventListener("click", () => { const n = S.findIndex(x => !x.done); cur = n < 0 ? (cur + 1) % D.length : n; sel = null; status(""); render(); });
render();
</script>
</body>
</html>
