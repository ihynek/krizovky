<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pexeso – Protista</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦠</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#f3eee4; --card:#fffdf8; --ink:#2b2a33; --muted:#76705f; --line:#ddd2bd;
    --accent:#1f4e79; --accent-soft:#e1ecf6; --chip:#efe3c8; --chip-line:#c9b68f;
    --ok:#2f7d5b; --bad:#b3412e;
    --t0:#e0782b; --t0-soft:#fbe3cf; --t1:#2b6cb0; --t1-soft:#d8e6f6;
    --display:"Literata",Georgia,serif; --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);line-height:1.25;overflow:hidden}
  .app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:12px 16px;gap:10px}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-family:var(--display);font-size:clamp(22px,3.2vw,38px);margin:0;line-height:1.1}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;font-weight:700;border-radius:999px;padding:9px 18px;cursor:pointer;border:1.5px solid var(--ink);background:var(--ink);color:#fff;touch-action:manipulation}
  button.ghost{background:transparent;color:var(--ink)}
  button:focus-visible{outline:3px solid #f2c14e;outline-offset:2px}
  .stage{display:grid;grid-template-columns:minmax(130px,.7fr) minmax(0,5fr) minmax(130px,.7fr);gap:16px;min-height:0}
  .team{align-self:center;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:16px;text-align:center;transition:border-color .2s,box-shadow .2s}
  .team h2{margin:0;font-family:var(--display);font-size:clamp(18px,2.2vw,28px)}
  .team .cnt{font-size:clamp(40px,6vw,76px);font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
  .team .lbl{color:var(--muted)}
  .team .turn{visibility:hidden;margin-top:6px;font-weight:700}
  .team.on .turn{visibility:visible}
  .t0 h2,.t0 .cnt{color:var(--t0)} .t1 h2,.t1 .cnt{color:var(--t1)}
  .team.on.t0{border-color:var(--t0);box-shadow:0 0 0 4px var(--t0-soft)} .team.on.t1{border-color:var(--t1);box-shadow:0 0 0 4px var(--t1-soft)}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr);gap:clamp(6px,1vw,14px);min-height:0}
  .c{position:relative;border:none;padding:0;border-radius:16px;background:transparent;color:var(--ink);perspective:900px;cursor:pointer;min-height:0}
  .c .f,.c .b{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;text-align:center;padding:8px;backface-visibility:hidden;transition:transform .45s}
  .c .b{background:var(--accent);color:#fff;font-family:var(--display);font-size:clamp(22px,3vw,44px);font-weight:700;
    background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.18) 0 18%,transparent 19%),radial-gradient(circle at 72% 68%,rgba(255,255,255,.12) 0 12%,transparent 13%)}
  .c .f{background:#fff;border:3px solid var(--chip-line);transform:rotateY(180deg);font-size:clamp(14px,1.7vw,26px)}
  .c .f.org{font-family:var(--display);font-weight:700;font-size:clamp(16px,2vw,30px);background:var(--chip)}
  .c.up .b{transform:rotateY(-180deg)} .c.up .f{transform:rotateY(0)}
  .c.m0 .f{border-color:var(--t0);background:var(--t0-soft)} .c.m1 .f{border-color:var(--t1);background:var(--t1-soft)}
  .c.miss .f{border-color:var(--bad)}
  .c.up,.c.m0,.c.m1{cursor:default}
  @media (prefers-reduced-motion:reduce){.c .f,.c .b{transition:none}}
  .msg{text-align:center;font-weight:700;font-size:clamp(16px,1.8vw,24px);min-height:1.4em}
  footer{text-align:center;color:var(--muted);font-size:.85em}
  .modal{position:fixed;inset:0;background:rgba(43,42,51,.55);display:none;place-items:center;z-index:10}
  .modal.show{display:grid}
  .box{background:var(--card);border-radius:24px;padding:40px 56px;text-align:center}
  .box .big{font-family:var(--display);font-size:clamp(34px,5vw,72px);margin:0 0 10px}
  @media (max-width:760px){.stage{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr}.grid{grid-column:1/-1;grid-row:2;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,1fr)}.team{padding:8px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Pexeso · Protista</h1>
    <div class="btns"><button class="ghost" id="rulesBtn" type="button">Pravidla</button><button class="ghost" id="newgame" type="button">Nová hra</button></div>
  </header>
  <div class="stage">
    <div class="team t0" id="team0"><h2>Oranžoví</h2><div class="cnt" id="s0">0</div><div class="lbl">dvojic</div><div class="turn">▶ na tahu</div></div>
    <div class="grid" id="grid"></div>
    <div class="team t1" id="team1"><h2>Modří</h2><div class="cnt" id="s1">0</div><div class="lbl">dvojic</div><div class="turn">▶ na tahu</div></div>
  </div>
  <div class="msg" id="msg">Tým na tahu otočí dvě kartičky: organismus a to, co k němu patří.</div>
  <footer>Biologie · Protista – hlavní skupiny · Gymnázium Joachima Barranda Beroun</footer>
</div>
<div class="modal" id="modal"><div class="box"><p class="big" id="endtxt"></p><p id="endsub" style="font-weight:700;color:var(--muted);font-size:22px"></p><button type="button" id="again">Hrát znovu</button></div></div>
<script>
const P = [
  ["trepka","brvy a dvě jádra"],
  ["zimnička","malárie"],
  ["plíseň bramborová","hladomor v Irsku"],
  ["rozsivka","křemičitá schránka ze dvou misek"],
  ["chaluha","kelpové lesy"],
  ["měňavka velká","laločnaté panožky"],
  ["hlenka","plazmodium a plodnice"],
  ["krásnoočko","stigma a mixotrofie"],
  ["trypanozoma","spavá nemoc"],
  ["lamblie","přísavný disk v tenkém střevě"],
  ["trubénka","límeček kolem bičíku"],
  ["kokolitka","křída"],
];
const TEAM = ["Oranžoví","Modří"], $ = id => document.getElementById(id);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let deck, open, turn, score, lock, found;
function newGame() {
  deck = shuffle(P.flatMap((p, i) => [{ pair: i, txt: p[0], org: true }, { pair: i, txt: p[1], org: false }]));
  open = []; turn = 0; score = [0, 0]; lock = false; found = 0;
  $("modal").classList.remove("show");
  $("grid").innerHTML = deck.map((d, i) => `<button type="button" class="c" id="k${i}" aria-label="Kartička ${i + 1}"><span class="b">${i + 1}</span><span class="f ${d.org ? "org" : ""}">${d.txt}</span></button>`).join("");
  deck.forEach((_, i) => $("k" + i).onclick = () => flip(i));
  msg("Tým na tahu otočí dvě kartičky: organismus a to, co k němu patří.");
  paint();
}
const msg = t => $("msg").textContent = t;
function paint() { [0, 1].forEach(t => { $("s" + t).textContent = score[t]; $("team" + t).classList.toggle("on", t === turn); }); }
function flip(i) {
  const el = $("k" + i);
  if (lock || el.classList.contains("up")) return;
  el.classList.add("up"); open.push(i);
  if (open.length < 2) return;
  const [a, b] = open;
  if (deck[a].pair === deck[b].pair) {
    $("k" + a).classList.add("m" + turn); $("k" + b).classList.add("m" + turn);
    score[turn]++; found++; open = [];
    msg(`Dvojice! ${TEAM[turn]} hrají znovu.`); paint();
    if (found === P.length) setTimeout(end, 700);
  } else {
    lock = true; $("k" + a).classList.add("miss"); $("k" + b).classList.add("miss");
    msg("Nepatří k sobě. Klepni kamkoli, kartičky se otočí zpět.");
    const back = () => {
      document.removeEventListener("pointerdown", back, true);
      [a, b].forEach(j => $("k" + j).classList.remove("up", "miss"));
      open = []; lock = false; turn = 1 - turn; paint(); msg(`Na tahu jsou ${TEAM[turn]}.`);
    };
    setTimeout(() => document.addEventListener("pointerdown", back, true), 300);
  }
}
function end() {
  $("endtxt").textContent = score[0] === score[1] ? "Remíza!" : `Vítězí ${TEAM[score[0] > score[1] ? 0 : 1]}!`;
  $("endtxt").style.color = score[0] === score[1] ? "var(--ink)" : `var(--t${score[0] > score[1] ? 0 : 1})`;
  $("endsub").textContent = `Oranžoví ${score[0]} : ${score[1]} Modří`;
  $("modal").classList.add("show");
}
$("again").onclick = newGame;
$("newgame").onclick = () => { if (confirm("Začít novou hru?")) newGame(); };
$("rulesBtn").onclick = () => alert("Pexeso\n\nTým na tahu otočí dvě kartičky. Dvojici tvoří organismus (žlutá kartička) a to, co k němu patří.\nNajde-li tým dvojici, získá bod a hraje znovu. Jinak se kartičky otočí zpět a hraje soupeř.\nVyhrává tým s více dvojicemi.");
newGame();
</script>
</body>
</html>
